<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Screen Recorder</title>
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f8f9fa;margin:0}
.container{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1);max-width:700px;width:95%;text-align:center}
h1{color:#007bff}
button{padding:.5rem 1rem;margin:.3rem;border:0;border-radius:6px;color:#fff;cursor:pointer}
#start{background:#28a745}#pause{background:#6c757d}#stop{background:#dc3545}#download{background:#007bff}
.timer{margin:1rem;font-weight:bold;color:#007bff}
video{width:100%;margin-top:1rem;border-radius:6px;background:#000}
</style>
</head>
<body>
<div class="container">
  <h1>Web Screen Recorder</h1>
  <p>App code link: <a href="https://surl.li/qqjdpt">https://surl.li/qqjdpt</a></p>
  <select id="size">
    <option value="default">Default</option>
    <option value="720p">720p</option>
    <option value="1080p">1080p</option>
    <option value="4k">4K</option>
  </select>
  <label><input type="checkbox" id="mic"> Mic</label><br>
  <button id="start">Start</button>
  <button id="pause" style="display:none">Pause</button>
  <button id="stop" style="display:none">Stop</button>
  <div class="timer" id="timer" style="display:none">00:00:00</div>
  <video id="live" autoplay muted style="display:none"></video>
  <div id="previewBox" style="display:none">
    <h3>Preview</h3>
    <video id="preview" controls></video>
    <button id="download">Download</button>
  </div>
</div>
  
<script>
let rec,chunks=[],startT,elapsed=0,timerI,fullBlob;
const $=id=>document.getElementById(id);
const fmt=ms=>new Date(ms).toISOString().substr(11,8);
function constraints(){
  switch($("size").value){
    case"720p":return{width:1280,height:720};
    case"1080p":return{width:1920,height:1080};
    case"4k":return{width:3840,height:2160};
    default:return{};
  }
}
async function startRec(){
  try{
    const scr=await navigator.mediaDevices.getDisplayMedia({video:constraints(),audio:true});
    if($("mic").checked){
      const mic=await navigator.mediaDevices.getUserMedia({audio:true});
      scr.addTrack(mic.getAudioTracks()[0]);
    }
    $("live").srcObject=scr;$("live").style.display="block";
    rec=new MediaRecorder(scr);
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{
      fullBlob=new Blob(chunks,{type:"video/webm"});
      chunks=[];
      $("preview").src=URL.createObjectURL(fullBlob);
      $("previewBox").style.display="block";
    };
    rec.start();
    startT=Date.now();elapsed=0;
    updateTimer();
    timerI=setInterval(updateTimer,1000);

    $("start").style.display="none";
    $("pause").style.display="inline";
    $("stop").style.display="inline";
    $("timer").style.display="block";
  }catch(e){alert("Permission denied or no media")}
}
function pauseRec(){
  if(rec.state=="recording"){
    rec.pause();
    clearInterval(timerI);
    elapsed+=Date.now()-startT;
    $("pause").textContent="Resume";
  }else{
    rec.resume();
    startT=Date.now();
    updateTimer();
    timerI=setInterval(updateTimer,1000);
    $("pause").textContent="Pause";
  }
}
function stopRec(){
  rec.stop();
  clearInterval(timerI);
  $("start").style.display="inline";
  $("pause").style.display="none";
  $("stop").style.display="none";
  $("timer").style.display="none";
  $("live").style.display="none";
}

function updateTimer(){
  $("timer").textContent=fmt(elapsed+(Date.now()-startT));
}
$("start").onclick=startRec;
$("pause").onclick=pauseRec;
$("stop").onclick=stopRec;
$("download").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(fullBlob);
  a.download="recording.webm";
  a.click();
};
$("speed").onchange=()=>{$("preview").playbackRate=parseFloat($("speed").value)};
</script>
</body>
</html>
