<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 900px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .aspect-ratio-button.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="container bg-white p-8 rounded-2xl shadow-xl w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">AI Image Generator</h1>
        <p class="text-center text-gray-500 mb-8">Enter a description, use a reference image, or enhance your prompt to create stunning images!</p>

        <div class="flex flex-col space-y-4">
            <textarea id="promptInput" rows="4" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200" placeholder="A futuristic city at sunset, cyberpunk style, vibrant colors..."></textarea>
            
            <div class="flex space-x-2">
                <label for="imageUpload" class="flex-1 w-full bg-gray-200 text-gray-800 font-semibold py-3 px-6 rounded-xl text-center cursor-pointer hover:bg-gray-300 transition duration-200 shadow-md">
                    Upload Image
                </label>
                <input type="file" id="imageUpload" class="hidden" accept="image/*" multiple>
                
                <button id="enhancePromptBtn" class="flex-1 bg-gray-200 text-gray-800 font-semibold py-3 px-6 rounded-xl hover:bg-gray-300 transition duration-200 shadow-md">
                    Enhance Prompt
                </button>
            </div>

            <div id="uploadedImageContainer" class="relative w-48 h-48 mx-auto hidden">
                <img id="uploadedImagePreview" class="w-full h-full object-contain rounded-xl border border-gray-300 shadow-md" src="" alt="Uploaded image preview">
                <button id="clearImageBtn" class="absolute top-1 right-1 bg-white rounded-full p-1 shadow-md hover:bg-gray-200 transition duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="aspectRatioContainer" class="flex justify-center flex-wrap gap-2 text-sm text-gray-600 font-medium">
                <span class="mr-2">Aspect Ratio:</span>
                <button class="aspect-ratio-button bg-gray-100 px-3 py-1 rounded-full border border-gray-300 hover:bg-gray-200 transition duration-150" data-ratio="9/16">9:16</button>
                <button class="aspect-ratio-button bg-gray-100 px-3 py-1 rounded-full border border-gray-300 hover:bg-gray-200 transition duration-150" data-ratio="16/9">16:9</button>
                <button class="aspect-ratio-button bg-gray-100 px-3 py-1 rounded-full border border-gray-300 hover:bg-gray-200 transition duration-150" data-ratio="4/3">4:3</button>
                <button class="aspect-ratio-button bg-gray-100 px-3 py-1 rounded-full border border-gray-300 hover:bg-gray-200 transition duration-150" data-ratio="3/4">3:4</button>
                <button class="aspect-ratio-button active bg-blue-500 text-white px-3 py-1 rounded-full border border-blue-500 transition duration-150" data-ratio="1/1">1:1</button>
            </div>

            <button id="generateBtn" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-blue-700 transition duration-200 shadow-md">
                Generate Images
            </button>
        </div>

        <div id="statusMessage" class="mt-6 text-center text-red-500 font-medium"></div>

        <div id="loadingIndicator" class="mt-8 flex justify-center hidden">
            <div class="spinner"></div>
        </div>

        <div id="imagesGrid" class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Generated images will be displayed here -->
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const imagesGrid = document.getElementById('imagesGrid');
        const statusMessage = document.getElementById('statusMessage');
        const imageUpload = document.getElementById('imageUpload');
        const enhancePromptBtn = document.getElementById('enhancePromptBtn');
        const aspectRatioContainer = document.getElementById('aspectRatioContainer');
        const aspectRatioButtons = document.querySelectorAll('.aspect-ratio-button');
        const uploadedImageContainer = document.getElementById('uploadedImageContainer');
        const uploadedImagePreview = document.getElementById('uploadedImagePreview');
        const clearImageBtn = document.getElementById('clearImageBtn');
        
        let uploadedBase64Image = null;
        let selectedRatio = '1/1';

        // Handles API calls, including exponential backoff for retries
        const fetchWithRetry = async (url, options, retries = 3, delay = 1000) => {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response;
            } catch (error) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                } else {
                    throw error;
                }
            }
        };

        // Function to convert base64 to a Blob
        const b64toBlob = (b64Data, contentType = '', sliceSize = 512) => {
            const byteCharacters = atob(b64Data);
            const byteArrays = [];
            for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                const slice = byteCharacters.slice(offset, offset + sliceSize);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }
            const blob = new Blob(byteArrays, { type: contentType });
            return blob;
        };

        // Function to crop an image to a specific aspect ratio using a canvas
        const cropImage = (image, targetRatio) => {
            return new Promise(resolve => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const [targetWidth, targetHeight] = targetRatio.split('/').map(Number);
                const imageRatio = image.naturalWidth / image.naturalHeight;
                const newRatio = targetWidth / targetHeight;

                let sourceX = 0;
                let sourceY = 0;
                let sourceWidth = image.naturalWidth;
                let sourceHeight = image.naturalHeight;

                if (imageRatio > newRatio) {
                    // Image is wider than the target ratio, so crop the width
                    sourceWidth = image.naturalHeight * newRatio;
                    sourceX = (image.naturalWidth - sourceWidth) / 2;
                } else {
                    // Image is taller than the target ratio, so crop the height
                    sourceHeight = image.naturalWidth / newRatio;
                    sourceY = (image.naturalHeight - sourceHeight) / 2;
                }

                canvas.width = sourceWidth;
                canvas.height = sourceHeight;

                ctx.drawImage(
                    image,
                    sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, sourceWidth, sourceHeight
                );

                resolve(canvas.toDataURL('image/png'));
            });
        };

        // Event listener for image upload
        imageUpload.addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = () => {
                    uploadedBase64Image = reader.result.split(',')[1];
                    uploadedImagePreview.src = reader.result;
                    uploadedImageContainer.classList.remove('hidden');
                    statusMessage.textContent = 'Image uploaded. This image will be used as a reference for generation. The API currently supports only one reference image.';
                    statusMessage.classList.remove('text-red-500');
                    statusMessage.classList.add('text-green-600');
                };
                reader.readAsDataURL(file);
            }
        });

        // Event listener to clear uploaded image
        clearImageBtn.addEventListener('click', () => {
            uploadedBase64Image = null;
            uploadedImagePreview.src = '';
            uploadedImageContainer.classList.add('hidden');
            statusMessage.textContent = 'Image cleared. The app is now in text-to-image mode.';
            statusMessage.classList.remove('text-red-500');
            statusMessage.classList.add('text-green-600');
            imageUpload.value = ''; // Clear the file input
        });

        // Event listener for prompt enhancement
        enhancePromptBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (prompt === '') {
                statusMessage.textContent = 'Please enter a description to enhance.';
                statusMessage.classList.remove('text-green-600');
                statusMessage.classList.add('text-red-500');
                return;
            }

            statusMessage.textContent = 'Enhancing prompt...';
            statusMessage.classList.remove('text-red-500', 'text-green-600');
            loadingIndicator.classList.remove('hidden');
            enhancePromptBtn.disabled = true;

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
            const systemPrompt = "Act as a creative prompt engineer. Expand and enhance the user's text for an AI image generator, making it more descriptive and imaginative. Only respond with the enhanced prompt, without any additional conversational text or greetings.";

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const response = await fetchWithRetry(apiUrl, options);
                const result = await response.json();
                const enhancedPrompt = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (enhancedPrompt) {
                    promptInput.value = enhancedPrompt.trim();
                    statusMessage.textContent = 'Prompt enhanced successfully!';
                    statusMessage.classList.add('text-green-600');
                } else {
                    statusMessage.textContent = 'Error: Could not enhance prompt.';
                    statusMessage.classList.remove('text-green-600');
                    statusMessage.classList.add('text-red-500');
                }
            } catch (error) {
                console.error('Error enhancing prompt:', error);
                statusMessage.textContent = 'An error occurred while enhancing the prompt. Please try again.';
                statusMessage.classList.remove('text-green-600');
                statusMessage.classList.add('text-red-500');
            } finally {
                loadingIndicator.classList.add('hidden');
                enhancePromptBtn.disabled = false;
            }
        });

        // Aspect ratio selection logic using event delegation
        aspectRatioContainer.addEventListener('click', (event) => {
            const button = event.target.closest('.aspect-ratio-button');
            if (button) {
                // Remove active class from all buttons
                aspectRatioButtons.forEach(btn => btn.classList.remove('active', 'bg-blue-500', 'text-white', 'border-blue-500'));
                aspectRatioButtons.forEach(btn => btn.classList.add('bg-gray-100', 'text-gray-600', 'border-gray-300'));

                // Add active class to the clicked button
                button.classList.add('active', 'bg-blue-500', 'text-white', 'border-blue-500');
                button.classList.remove('bg-gray-100', 'text-gray-600', 'border-gray-300');

                selectedRatio = button.dataset.ratio;
            }
        });

        // Main generate button event listener
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (prompt === '') {
                statusMessage.textContent = 'Please enter a description for the image.';
                statusMessage.classList.remove('text-green-600');
                statusMessage.classList.add('text-red-500');
                return;
            }

            // Clear previous content and show loading state
            statusMessage.textContent = '';
            imagesGrid.innerHTML = '';
            loadingIndicator.classList.remove('hidden');
            generateBtn.disabled = true;
            
            let apiUrl, payload, options;
            let sampleCount = uploadedBase64Image ? 1 : 4;

            if (uploadedBase64Image) {
                generateBtn.textContent = `Generating ${sampleCount} Image...`;
                // Use gemini-2.5-flash-image-preview for image-to-image generation
                apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=`;
                payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: 'image/png', data: uploadedBase64Image } }
                        ]
                    }],
                    generationConfig: {
                        responseModalities: ['TEXT', 'IMAGE']
                    }
                };
            } else {
                generateBtn.textContent = `Generating ${sampleCount} Images...`;
                // Use imagen-3.0-generate-002 for text-to-image generation
                apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=`;
                payload = {
                    instances: {
                        prompt: prompt
                    },
                    parameters: {
                        "sampleCount": sampleCount
                    }
                };
            }

            options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            try {
                const response = await fetchWithRetry(apiUrl, options);
                const result = await response.json();

                let generatedImages = [];
                if (uploadedBase64Image) {
                    // Handle response for gemini-2.5-flash-image-preview
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64Data) {
                        generatedImages.push(base64Data);
                    }
                } else {
                    // Handle response for imagen-3.0-generate-002
                    generatedImages = result?.predictions?.map(p => p.bytesBase64Encoded) || [];
                }

                if (generatedImages.length > 0) {
                    const originalImages = generatedImages.map(base64Data => {
                        return new Promise(resolve => {
                            const img = new Image();
                            img.onload = () => resolve(img);
                            img.src = `data:image/png;base64,${base64Data}`;
                        });
                    });

                    const imagesToDisplay = await Promise.all(originalImages);

                    imagesToDisplay.forEach(async (imgElement, index) => {
                        const croppedDataUrl = await cropImage(imgElement, selectedRatio);
                        const base64Data = croppedDataUrl.split(',')[1];
                        
                        const imageCard = document.createElement('div');
                        imageCard.classList.add('flex', 'flex-col', 'space-y-4', 'items-center', 'p-4', 'bg-white', 'rounded-xl', 'shadow-md', 'border', 'border-gray-200');
                        imageCard.style.aspectRatio = selectedRatio;

                        const displayImg = document.createElement('img');
                        displayImg.src = croppedDataUrl;
                        displayImg.alt = prompt;
                        displayImg.classList.add('w-full', 'rounded-xl', 'h-full', 'object-contain', 'shadow');
                        
                        const downloadBtn = document.createElement('a');
                        downloadBtn.href = croppedDataUrl;
                        downloadBtn.download = `generated_image_${index + 1}.png`;
                        downloadBtn.textContent = `Download Image ${index + 1}`;
                        downloadBtn.classList.add('bg-green-600', 'text-white', 'font-semibold', 'py-2', 'px-4', 'rounded-xl', 'hover:bg-green-700', 'transition', 'duration-200');
                        
                        // Use a more robust download method
                        downloadBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            const blob = b64toBlob(base64Data, 'image/png');
                            const blobUrl = URL.createObjectURL(blob);
                            const tempLink = document.createElement('a');
                            tempLink.style.display = 'none';
                            tempLink.href = blobUrl;
                            tempLink.download = `generated_image_${index + 1}.png`;
                            document.body.appendChild(tempLink);
                            tempLink.click();
                            document.body.removeChild(tempLink);
                            URL.revokeObjectURL(blobUrl);
                        });

                        imageCard.appendChild(displayImg);
                        imageCard.appendChild(downloadBtn);
                        imagesGrid.appendChild(imageCard);
                    });
                } else {
                    statusMessage.textContent = 'Error: No images received. Please try a different prompt.';
                    statusMessage.classList.remove('text-green-600');
                    statusMessage.classList.add('text-red-500');
                }
            } catch (error) {
                console.error('Error generating image:', error);
                statusMessage.textContent = 'An error occurred. Please check the console for details and try again later.';
                statusMessage.classList.remove('text-green-600');
                statusMessage.classList.add('text-red-500');
            } finally {
                loadingIndicator.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Images';
            }
        });
    </script>
</body>
</html>
